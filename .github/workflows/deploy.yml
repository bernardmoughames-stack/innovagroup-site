# Builds the website (new-website/) and publishes it, automatically,
# on every change to main.

name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: new-website/package-lock.json
      - name: Install
        run: npm ci
      - name: Generate service pages
        run: node tools/build-pages.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build --base=/
      - name: Production layout (URL parity, sitemap, redirects)
        run: node tools/prepare-deploy.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: new-website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tell Bing/Yandex (and the AI search engines that read their indexes)
      # about every published URL, straight from the live sitemap.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          sleep 30
          urls=$(curl -sS https://innovagroup.co.ae/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//')
          payload=$(printf '%s\n' "$urls" | jq -R . | jq -s '{host:"innovagroup.co.ae",key:"50d8633c3a3a1f05e5d2b246dc0d0249",keyLocation:"https://innovagroup.co.ae/50d8633c3a3a1f05e5d2b246dc0d0249.txt",urlList:.}')
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload" -w "\nIndexNow HTTP %{http_code}\n"
