# Builds the website (new-website/) and publishes it, automatically,
# on every change to main.

name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: new-website/package-lock.json
      - name: Install
        run: npm ci
      - name: Generate service pages
        run: node tools/build-pages.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build --base=/
      - name: Production layout (URL parity, sitemap, redirects)
        run: node tools/prepare-deploy.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: new-website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
