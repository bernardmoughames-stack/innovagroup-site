# ============================================================
# Innova Group — editor configuration for Pages CMS
# This file tells the admin panel what fields to show.
# You don't need to touch it to edit the website.
# ============================================================

media:
  input: src/assets/img
  output: /assets/img
  categories: [image]

content:

  # ----------------------------------------------------------
  - name: services
    label: Services
    type: file
    path: content/services.json
    format: json
    list: true
    view:
      fields: [nav, slug]
    fields:
      - name: nav
        label: Service name
        type: string
        required: true
        description: Shown in the menu and the footer.
      - name: slug
        label: Web address
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: "Lowercase, no spaces. 'contracting' becomes innovagroup.co.ae/contracting/"
      - name: icon
        label: Icon
        type: select
        options:
          values: [shell, tasks, tools, screen, magnifier, megaphone, bars, chip, shield, clock, chart, spark, building, check]
      - name: cardTitle
        label: Home page card — title
        type: string
      - name: cardText
        label: Home page card — one line
        type: text
      - name: eyebrow
        label: Small label above the page title
        type: string
      - name: heading
        label: Page headline
        type: string
        required: true
      - name: intro
        label: Paragraph under the headline
        type: text

      - name: overview
        label: Overview section
        type: object
        fields:
          - { name: eyebrow, label: Small label, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: lead, label: Opening line, type: text }
          - { name: body, label: Paragraphs, type: text, list: true }

      - name: scope
        label: Scope of work section
        type: object
        fields:
          - { name: eyebrow, label: Small label, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: lead, label: Intro line, type: text }
          - { name: items, label: Scope items, type: string, list: true }

      - name: packages
        label: Packages section
        type: object
        fields:
          - { name: eyebrow, label: Small label, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: sub, label: Intro line, type: text }
          - name: tiers
            label: Package tiers
            type: object
            list: true
            fields:
              - { name: name, label: Package name, type: string, required: true }
              - { name: featured, label: Highlight this one, type: boolean }
              - { name: for, label: "Who it's for", type: text }
              - { name: items, label: What's included, type: string, list: true }

      - name: steps
        label: How it works — four steps
        type: object
        list: true
        fields:
          - { name: title, label: Step name, type: string }
          - { name: text, label: Description, type: text }

      - name: faqs
        label: Questions
        type: object
        list: true
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer, type: text }

      - name: metaTitle
        label: "Search engines — page title"
        type: string
        description: Keep under about 60 characters.
      - name: metaDescription
        label: "Search engines — description"
        type: text
        description: Keep under about 155 characters.

