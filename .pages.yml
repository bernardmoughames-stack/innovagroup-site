  # ----------------------------------------------------------
  - name: site
    label: Company & pages
    type: file
    path: content/site.json
    format: json
    fields:

      - name: company
        label: Company details
        type: object
        fields:
          - { name: name, label: Company name, type: string }
          - { name: domain, label: Website address, type: string, description: "No trailing slash, e.g. https://innovagroup.co.ae" }
          - { name: email, label: Email, type: string }
          - { name: phone, label: Phone (as displayed), type: string }
          - { name: phoneLink, label: Phone (digits only, for tap-to-call), type: string }
          - { name: location, label: Location (short), type: string }
          - { name: locationLong, label: Location (full), type: string }
          - { name: licenceLine, label: Licence line in the footer, type: string }
          - { name: tagline, label: Footer description, type: text }

      - name: home
        label: Home page
        type: object
        fields:
          - { name: metaTitle, label: "Search engines — title", type: string }
          - { name: metaDescription, label: "Search engines — description", type: text }
          - name: hero
            label: Opening section
            type: object
            fields:
              - { name: eyebrow, label: Small label, type: string }
              - { name: heading, label: Headline, type: text, description: "Use <br> for a line break and <em>word</em> for gold italics." }
              - { name: intro, label: Paragraph, type: text }
              - name: primaryCta
                label: Main button
                type: object
                fields:
                  - { name: label, label: Button text, type: string }
                  - { name: href, label: Links to, type: string }
              - name: secondaryCta
                label: Second button
                type: object
                fields:
                  - { name: label, label: Button text, type: string }
                  - { name: href, label: Links to, type: string }
              - name: meta
                label: Three facts under the buttons
                type: object
                list: true
                fields:
                  - { name: label, label: Label, type: string }
                  - { name: value, label: Value, type: string }
          - name: intro
            label: "\"The group\" section"
            type: object
            fields:
              - { name: eyebrow, label: Small label, type: string }
              - { name: heading, label: Heading, type: text }
              - { name: lead, label: Opening line, type: text }
              - { name: body, label: Paragraphs, type: text, list: true }
          - name: servicesSection
            label: Services grid heading
            type: object
            fields:
              - { name: eyebrow, label: Small label, type: string }
              - { name: heading, label: Heading, type: string }
              - { name: sub, label: Intro line, type: text }
          - name: why
            label: "\"Why Innova\" section"
            type: object
            fields:
              - { name: eyebrow, label: Small label, type: string }
              - { name: heading, label: Heading, type: string }
              - name: items
                label: Reasons
                type: object
                list: true
                fields:
                  - name: icon
                    label: Icon
                    type: select
                    options:
                      values: [shield, clock, chart, spark, building, check, shell, tasks, tools, screen, magnifier, megaphone, bars, chip]
                  - { name: title, label: Title, type: string }
                  - { name: text, label: Text, type: text }
          - name: process
            label: "\"How we work\" section"
            type: object
            fields:
              - { name: eyebrow, label: Small label, type: string }
              - { name: heading, label: Heading, type: string }
              - name: steps
                label: Steps
                type: object
                list: true
                fields:
                  - { name: title, label: Step name, type: string }
                  - { name: text, label: Description, type: text }
          - name: cta
            label: Closing contact band
            type: object
            fields:
              - { name: heading, label: Heading, type: string }
              - { name: text, label: Text, type: text }
              - name: button
                label: Button
                type: object
                fields:
                  - { name: label, label: Button text, type: string }
                  - { name: href, label: Links to, type: string }

      - name: about
        label: About page
        type: object
        fields:
          - { name: metaTitle, label: "Search engines — title", type: string }
          - { name: metaDescription, label: "Search engines — description", type: text }
          - { name: eyebrow, label: Small label, type: string }
          - { name: heading, label: Headline, type: string }
          - { name: intro, label: Paragraph under the headline, type: text }
          - name: sections
            label: Sections
            type: object
            list: true
            fields:
              - { name: eyebrow, label: Small label, type: string }
              - { name: heading, label: Heading, type: string }
              - { name: body, label: Paragraphs, type: text, list: true }
          - name: values
            label: Commitments
            type: object
            fields:
              - { name: eyebrow, label: Small label, type: string }
              - { name: heading, label: Heading, type: string }
              - name: items
                label: Items
                type: object
                list: true
                fields:
                  - { name: title, label: Title, type: string }
                  - { name: text, label: Text, type: text }

      - name: contact
        label: Contact page
        type: object
        fields:
          - { name: metaTitle, label: "Search engines — title", type: string }
          - { name: metaDescription, label: "Search engines — description", type: text }
          - { name: eyebrow, label: Small label, type: string }
          - { name: heading, label: Headline, type: string }
          - { name: intro, label: Paragraph under the headline, type: text }
          - { name: formNote, label: Note under the form, type: text }

      - name: footer
        label: Footer
        type: object
        fields:
          - name: columns
            label: Column headings
            type: object
            fields:
              - { name: servicesHeading, label: Services column, type: string }
              - { name: contactHeading, label: Contact column, type: string }
              - { name: companyHeading, label: Company column, type: string }
          - name: companyLinks
            label: Company links
            type: object
            list: true
            fields:
              - { name: label, label: Link text, type: string }
              - { name: href, label: Links to, type: string }
